<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - VPNSIEUCAP</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #7b0000, #ff1e1e, #3a0000);
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .header-container {
            text-align: center; margin-bottom: 15px; background: rgba(0, 0, 0, 0.4);
            padding: 15px 25px; border-radius: 15px; border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); width: 100%; max-width: 480px;
        }
        h1 { font-size: 22px; color: #ffd700; text-transform: uppercase; margin-bottom: 10px; }
        .user-input-box { margin: 10px 0; text-align: left; }
        .user-input-box label { font-size: 13px; color: #ffcc00; display: block; margin-bottom: 5px; }
        .user-input-box input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ffd700;
            background: #111; color: #fff; font-size: 14px; text-align: center;
        }
        .user-input-box input:disabled {
            background: #222; color: #888; border-color: #666;
        }
        .wheel-container { position: relative; width: 340px; height: 340px; margin: 15px auto; }
        canvas {
            width: 100%; height: 100%; border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6); border: 6px solid #ffd700;
        }
        .wheel-pointer {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 25px solid #fff; z-index: 10;
        }
        .center-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75px; height: 75px; background: radial-gradient(circle, #ff3333, #990000);
            border: 3px solid #ffd700; border-radius: 50%; color: #fff; font-weight: bold; font-size: 13px;
            cursor: pointer; z-index: 5; text-align: center; line-height: 1.2; padding: 5px;
        }
        .center-btn:disabled {
            background: #555; border-color: #888; color: #ccc; cursor: not-allowed;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #2a0000; border: 2px solid #ffd700; padding: 20px;
            border-radius: 15px; width: 90%; max-width: 400px; text-align: center;
        }
        .btn {
            background: linear-gradient(to bottom, #ffcc00, #ff9900); color: #000; font-weight: bold;
            padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; margin-top: 15px; width: 100%;
        }
        #loadingText { color: #ffcc00; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>VÒNG QUAY VPNSIEUCAP</h1>
        <div class="user-input-box">
            <label>Nhập Tài Khoản / SĐT đã đăng ký:</label>
            <input type="text" id="userInfoInput" placeholder="Nhập tài khoản của bạn...">
        </div>
        <div id="loadingText">⏳ Đang tải dữ liệu từ hệ thống...</div>
    </div>

    <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <button class="center-btn" id="spinBtn" onclick="startSpin()" disabled>QUAY</button>
    </div>

    <!-- Modal Kết Quả -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>🎉 CHÚC MỪNG BẠN! 🎉</h2>
            <p id="resultText" style="font-size: 18px; margin: 15px 0; color: #ffcc00; font-weight: bold;"></p>
            <p style="font-size: 12px; color: #ccc;">VPNSIEUCAP sẽ xác minh và tự động trao phần thưởng cho tài khoản của bạn!</p>
            <button class="btn" onclick="closeModal()">Đã Hiểu</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYYrfTB7RJt70IVLubzuvEKx7m-eey-qjKGotO1JC13JzJOMbBWODOzmP0eYCO3IoS/exec";

        let prizes = [];
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let startAngle = 0;
        let isSpinning = false;

        async function loadPrizesFromSheet() {
            try {
                let res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getPrizes`);
                let data = await res.json();
                if (data.status === "success" && data.prizes.length > 0) {
                    prizes = data.prizes;
                    drawWheel();
                    document.getElementById('loadingText').innerText = "✅ Sẵn sàng quay!";
                    document.getElementById('spinBtn').disabled = false;
                }
            } catch (err) {
                document.getElementById('loadingText').innerText = "❌ Lỗi kết nối máy chủ!";
                console.error(err);
            }
        }

        function drawWheel() {
            if (prizes.length === 0) return;
            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let currentAngle = startAngle;
            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 190, currentAngle, currentAngle + arcSize, false);
                ctx.lineTo(200, 200);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(currentAngle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px Arial";
                
                let displayName = prizes[i].name;
                if (displayName.length > 16) displayName = displayName.substring(0, 14) + '...';
                
                ctx.fillText(displayName, 170, 5);
                ctx.restore();

                currentAngle += arcSize;
            }
        }

        async function startSpin() {
            // Chặn ngay nếu đang xử lý hoặc đang quay
            if (isSpinning) return;

            const userInfoInput = document.getElementById('userInfoInput');
            const spinBtn = document.getElementById('spinBtn');
            const userInfo = userInfoInput.value.trim();

            if (!userInfo) {
                alert("Vui lòng nhập Tài khoản / SĐT của bạn!");
                return;
            }

            // Khóa nút QUAY & Ô nhập thông tin lập tức để chống spam click
            isSpinning = true;
            spinBtn.disabled = true;
            userInfoInput.disabled = true;
            spinBtn.innerText = "ĐANG XỬ LÝ";

            // Gọi lên Google Sheets kiểm tra điều kiện
            try {
                let checkRes = await fetch(`${GOOGLE_SCRIPT_URL}?sdt=${encodeURIComponent(userInfo)}`);
                let checkData = await checkRes.json();
                
                if (checkData.status === "khong_ton_tai" || checkData.status === "da_quay") {
                    alert(checkData.message);
                    
                    // Mở lại nút nếu thông tin không hợp lệ
                    isSpinning = false;
                    spinBtn.disabled = false;
                    userInfoInput.disabled = false;
                    spinBtn.innerText = "QUAY";
                    return;
                }
            } catch (e) {
                alert("❌ Lỗi kiểm tra tài khoản. Vui lòng thử lại!");
                
                // Mở lại nút nếu bị lỗi kết nối
                isSpinning = false;
                spinBtn.disabled = false;
                userInfoInput.disabled = false;
                spinBtn.innerText = "QUAY";
                return;
            }

            spinBtn.innerText = "ĐANG QUAY";

            // Xử lý tỷ lệ phần trăm trúng thưởng
            let totalRate = prizes.reduce((sum, p) => sum + p.rate, 0);
            let randomNum = Math.random() * totalRate;
            let currentSum = 0;
            let winningIndex = 0;

            for (let i = 0; i < prizes.length; i++) {
                currentSum += prizes[i].rate;
                if (randomNum <= currentSum) {
                    winningIndex = i;
                    break;
                }
            }

            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const targetAngle = 3 * Math.PI / 2 - (winningIndex * arcSize + arcSize / 2);
            const totalRotation = 10 * Math.PI + (targetAngle - (startAngle % (2 * Math.PI)));

            let startTime = null;
            const spinDuration = 4000;

            function animateSpin(timestamp) {
                if (!startTime) startTime = timestamp;
                let elapsed = timestamp - startTime;
                let progress = Math.min(elapsed / spinDuration, 1);
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                
                startAngle = startAngle + (totalRotation * (easeProgress - (animateSpin.lastProgress || 0)));
                animateSpin.lastProgress = easeProgress;

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    animateSpin.lastProgress = 0;

                    const wonPrize = prizes[winningIndex].name;
                    
                    // Gửi kết quả về Google Sheets
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ userInfo: userInfo, prize: wonPrize })
                    });

                    // Hiển thị kết quả
                    document.getElementById('resultText').innerText = wonPrize;
                    document.getElementById('resultModal').style.display = 'flex';
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

                    // Giữ nguyên trạng thái đã quay để không cho bấm tiếp
                    spinBtn.innerText = "ĐÃ QUAY";
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        loadPrizesFromSheet();
    </script>
</body>
</html>
