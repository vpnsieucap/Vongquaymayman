    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%);
            color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
            padding: 20px 15px 40px 15px; overflow-x: hidden;
        }

        .main-wrapper {
            width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center;
        }

        /* 🔴 KHUNG HEADER ĐỎ VIỀN VÀNG SANG TRỌNG */
        .header-container {
            text-align: center; margin-bottom: 25px; 
            background: linear-gradient(135deg, #d32f2f, #990000);
            padding: 22px 20px; border-radius: 24px; 
            border: 3px solid #ffd700;
            box-shadow: 0 10px 30px rgba(153, 0, 0, 0.4), inset 0 2px 8px rgba(255, 255, 255, 0.3); 
            width: 100%; position: relative;
        }

        h1 { 
            font-size: 20px; font-weight: 900; color: #ffd700;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        /* CÁC NÚT ĐIỀU HƯỚNG BÊN TRONG HEADER */
        .nav-btn-box {
            display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 12px;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #ffd700; border-radius: 30px;
            padding: 11px 20px; color: #fff; font-weight: 700; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; text-decoration: none; transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .nav-button:hover { background: rgba(255, 215, 0, 0.25); transform: translateY(-1px); }

        /* Ô NHẬP USER ID */
        .user-input-box {
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid #ffd700; border-radius: 30px;
            padding: 8px 15px; display: flex; align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
        }
        .user-input-box input {
            width: 100%; border: none; background: transparent; color: #ffd700; 
            font-size: 14px; font-weight: 700; text-align: center; outline: none;
        }
        .user-input-box input::placeholder { color: rgba(255, 215, 0, 0.6); font-weight: 600; }
        .user-input-box input:disabled { color: #aaa; }

        #loadingText { color: #ffff80; font-size: 11px; font-weight: 600; margin-top: 10px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        /* 🎡 KHUNG VÒNG QUAY ĐỎ VIỀN ĐÈN LED */
        .wheel-container { 
            position: relative; width: 350px; height: 350px; margin: 10px auto 25px auto; 
            background: linear-gradient(135deg, #e60000, #800000);
            border-radius: 50%; padding: 14px;
            box-shadow: 0 12px 35px rgba(153, 0, 0, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.5);
            border: 4px solid #ffd700;
        }
        
        canvas {
            width: 100%; height: 100%; border-radius: 50%;
            background: #fff; box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
